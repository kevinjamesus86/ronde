[package]
name = "ronde-lock"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
strip = "symbols"
