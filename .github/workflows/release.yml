name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build @ronde/lock (native) for this host
        working-directory: packages/lock
        run: npx napi build --platform --release --no-js

      - run: npm run check
      - run: npm test

  build-lock:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm ci

      - name: Build native
        working-directory: packages/lock
        run: npx napi build --platform --release --no-js --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: lock-${{ matrix.target }}
          path: packages/lock/*.node
          if-no-files-found: error

  publish:
    needs: [verify, build-lock]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: packages/lock
          merge-multiple: true

      - name: Build dist
        run: npm run build

      - name: Push release branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          BRANCH="release/${TAG}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git checkout -B "$BRANCH"
          git add -f dist packages/lock/*.node
          git commit -m "release: ${TAG}"
          git push -f origin "$BRANCH"
